<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Elif Apartmanı</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="top-title">
      <div class="brand">Elif Apartmanı</div>
      <div class="sub" id="top-sub"></div>
    </div>
    <div class="top-actions">
    <button type="button" class="bell" data-act="bildirimler" aria-label="Bildirimler">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 22a2.5 2.5 0 0 0 2.5-2.5h-5A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5.5-6.8V3.5a1.5 1.5 0 0 0-3 0v.7A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2z"/></svg>
      <span class="badge" id="bell-badge" hidden></span>
    </button>
    <div class="periodnav" id="periodnav">
      <button type="button" data-act="donem-geri" aria-label="Önceki">‹</button>
      <span id="donem-label"></span>
      <button type="button" data-act="donem-ileri" aria-label="Sonraki">›</button>
    </div>
    </div>
  </div>
  <div id="update-banner" class="update" hidden></div>
</header>

<main id="main"></main>

<button type="button" class="fab" id="fab" data-act="odeme-yeni">+ Ödeme Gir</button>

<nav class="tabs" id="tabs">
  <button type="button" data-act="sekme" data-tab="ozet">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4v9zm0 7h6v-5H4v5zm10 0h6v-9h-6v9zm0-16v5h6V4h-6z" fill="currentColor"/></svg>
    <span>Özet</span>
  </button>
  <button type="button" data-act="sekme" data-tab="daireler">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18h-5v-4h-4v4H5V3zm3 3v2h2V6H8zm6 0v2h2V6h-2zm-6 4v2h2v-2H8zm6 0v2h2v-2h-2z" fill="currentColor"/></svg>
    <span>Daireler</span>
  </button>
  <button type="button" data-act="sekme" data-tab="komur">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 3.5 5 6 5 11a5 5 0 0 1-10 0c0-2.2 1-3.8 2.2-5.2.3 1.6 1.1 2.7 2.3 3.2C11 8.5 11.3 5 12 2z" fill="currentColor"/></svg>
    <span>Kömür</span>
  </button>
  <button type="button" data-act="sekme" data-tab="gecmis">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3a9 9 0 1 0 8.9 10.3h-2A7 7 0 1 1 13 5v3l4-4-4-4v3zm-1 5v5.4l4 2.4.8-1.3-3.3-2V8H12z" fill="currentColor"/></svg>
    <span>Geçmiş</span>
  </button>
  <button type="button" data-act="sekme" data-tab="ayarlar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" fill="currentColor"/></svg>
    <span>Ayarlar</span>
  </button>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-head">
    <button type="button" class="icon-btn" data-act="sheet-geri" aria-label="Geri">←</button>
    <h2 id="sheet-title"></h2>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
<script src="senk.js"></script>
</body>
</html>
