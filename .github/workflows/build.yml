name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ekran sürümünü yaz
        run: |
          printf '{"surum": %s, "native": %s}\n' "${{ github.run_number }}" "$(cat native_api.txt)" > app/src/main/assets/web.json
          cat app/src/main/assets/web.json

      - name: APK derle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/release/app-release.apk ElifApartmani.apk

      - name: Sürüm yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Sürüm 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: |
            ElifApartmani.apk
            app/src/main/assets/web.json
            app/src/main/assets/index.html
            app/src/main/assets/app.js
            app/src/main/assets/app.css
          make_latest: true
